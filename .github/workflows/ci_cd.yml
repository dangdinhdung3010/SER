name: SER AI Pipeline CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-test-ai:
    name: 1. CI - Kiểm thử Cú pháp & Mô hình DINOv3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn từ Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Thiết lập môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cài đặt PyTorch (CPU nhẹ cho CI) và các thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Kiểm tra lỗi cú pháp nghiêm trọng (Syntax & Indentation Errors)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m py_compile step1_data_collector.py step2_edge_preprocessing.py step3_1d_swin_model.py step6_deploy_app.py

      - name: Kiểm tra sự tồn tại của Trọng số Mô hình (.pth)
        run: |
          if [ -f "emo_db_storage/checkpoints/best_dinov3_compact.pth" ] || [ -f "emo_db_storage/checkpoints/best_dinov3_ser.pth" ]; then
            echo "✅ Đã tìm thấy file trọng số mô hình hợp lệ."
          else
            echo "⚠️ Cảnh báo: Chưa có file .pth trong emo_db_storage/checkpoints/, hệ thống sẽ dùng trọng số Pretrained mặc định."
          fi

      - name: Chạy Unit Test & Integration Test (Pytest)
        run: |
          python -m pytest tests/test_ser_pipeline.py -v

  deploy-to-production:
    name: 2. CD - Phát hành lên nhánh Production (Streamlit Cloud)
    needs: build-and-test-ai
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn đã vượt qua kiểm thử
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tự động đồng bộ sang nhánh Production để kích hoạt Streamlit Deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/production --force
